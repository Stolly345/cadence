[package]
name = "cadence"
version = "0.3.0"
edition = "2024"
description = "Run backups, clean-ups and scripts on a schedule, from ready-made examples"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stolly345/cadence"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
chrono = "0.4.45"
croner = "4.0.2"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[package.metadata.deb]
maintainer = "Alex Stoll <114888417+Stolly345@users.noreply.github.com>"
copyright = "2026, Alex Stoll"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), rsync, cron | cron-daemon, libnotify-bin, pkexec | policykit-1"
recommends = "curl, smartmontools, git"
extended-description = """\
Cadence runs backups, clean-ups, updates and scripts on a schedule, without \
needing to know Linux. Start from ready-made examples in plain words (back up \
a folder to a USB drive, sort Downloads, keep the computer updated, warn when \
the disk is full) or write your own bash scripts and cron schedules. Every run \
is logged, and failures show a desktop notification."""
assets = [
    ["target/release/cadence", "usr/bin/", "755"],
    ["data/io.github.stolly345.cadence.desktop", "usr/share/applications/", "644"],
    ["data/io.github.stolly345.cadence.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/cadence/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/cadence/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/cadence/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
summary = "Run backups, clean-ups and scripts on a schedule, from ready-made examples"
release = "1"
assets = [
    { source = "target/release/cadence", dest = "/usr/bin/cadence", mode = "755" },
    { source = "data/io.github.stolly345.cadence.desktop", dest = "/usr/share/applications/io.github.stolly345.cadence.desktop", mode = "644" },
    { source = "data/io.github.stolly345.cadence.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.stolly345.cadence.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cadence/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/cadence/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/cadence/LICENSE-APACHE", mode = "644" },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
rsync = "*"
cronie = "*"
libnotify = "*"
"/usr/bin/pkexec" = "*"

[package.metadata.generate-rpm.recommends]
curl = "*"
smartmontools = "*"
git = "*"

[profile.release]
strip = true
lto = true
